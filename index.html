<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUXO BEAUTY SISTEMA DE GESTÃO</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
  rel="stylesheet">
<style>
  :root {
    --brand-primary: #800020;
    /* Deep Burgundy */
    --brand-accent: #D4AF37;
    /* Metallic Gold */
    --brand-bg: #FCF9F9;
    /* Elegant Off-white */
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--brand-bg);
    color: #020617;
  }

  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }

  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .custom-scrollbar::-webkit-scrollbar {
    width: 4px;
  }

  .custom-scrollbar::-webkit-scrollbar-track {
    background: #fdf2f4;
  }

  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #e5cbd1;
    border-radius: 10px;
  }

  /* Global Professional Overrides */
  .btn-primary {
    background-color: var(--brand-primary);
    color: white;
    transition: all 0.3s ease;
  }

  .btn-primary:hover {
    background-color: #600018;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(128, 0, 32, 0.15);
  }

  .text-brand {
    color: var(--brand-primary);
  }

  .bg-brand {
    background-color: var(--brand-primary);
  }

  .border-brand {
    border-color: var(--brand-primary);
  }

  /* WebKit/Safari Backdrop Blur Compatibility */
  .backdrop-blur-sm {
    -webkit-backdrop-filter: blur(4px) !important;
    backdrop-filter: blur(4px) !important;
  }
  .backdrop-blur-md {
    -webkit-backdrop-filter: blur(12px) !important;
    backdrop-filter: blur(12px) !important;
  }
  .backdrop-blur-lg {
    -webkit-backdrop-filter: blur(16px) !important;
    backdrop-filter: blur(16px) !important;
  }
  .backdrop-blur-xl {
    -webkit-backdrop-filter: blur(24px) !important;
    backdrop-filter: blur(24px) !important;
  }
  .backdrop-blur-2xl {
    -webkit-backdrop-filter: blur(40px) !important;
    backdrop-filter: blur(40px) !important;
  }

  /* Smooth momentum scrolling on iOS */
  .overflow-y-auto, .overflow-x-auto, .custom-scrollbar {
    -webkit-overflow-scrolling: touch;
  }

  /* Custom styling for Select elements in iOS Safari to display burgundy arrow */
  select {
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23800020' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 1.25rem center;
    background-size: 1rem;
    padding-right: 2.5rem !important;
  }
</style>
